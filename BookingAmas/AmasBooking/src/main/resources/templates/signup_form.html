<main>

  <div class="banner">
    <img src="images/slide4.webp" alt=""  >
  </div>


<div class="row p-5 text-center">
    <div class="col-6 mt-4 mx-auto">
        
        <h1 class="col-6 mt-4 mx-auto justify-content-c">Register</h1>
        <div class="formMessage error" th:if="${error != null}" th:text="${error}"></div>
        <div class="formMessage success" th:if="${success != null}" th:text="${success}"></div>


        <form th:action="@{/process_register}" method="post"
              style="max-width: 600px; margin: 0 auto;"
                th:object="${user}">

            <div class="m-3">
                <div class="form-group row">
                    <label class="col-form-label col-4">First Name</label>
                    <div class="col-8">
                        <input type="text" class="form-control"  th:field="*{firstName}" required
                               minlength="2" maxlength="20"/>
                    </div>
                </div>

               <div class="form-group row">
                  <label class="col-form-label col-4">Last Name</label>
                  <div class="col-8">
                       <input type="text" class="form-control"  th:field="*{lastName}" required
                             minlength="2" maxlength="20" />
                  </div>
               </div>

                <div class="form-group row">
                 <label class="col-form-label col-4">Email</label>
                  <div class="col-8">
                       <input type="email" class="form-control" th:field="*{email}" required />
                  </div>
                </div>

                <div class="form-group row">
                   <label class="col-form-label col-4">Password</label>
                 <div class="col-8">
                    <input type="password" name="password" id="password" class="form-control" th:field="*{password}" required
                    minlength="6" maxlength="12" />
                 </div>
                </div>


                <div class="form-group row">
                    <label class="col-form-label col-4">Civility</label>
                    <div class="col-8">
                        <div id="subform_part_civ" >
                            <div >
                                <input type="radio" name="civility" value="M." id="male" />
                                <label for="male" class="col-form-label col-4">M.</label>
                            </div>
                            <div>
                                <input type="radio" name="civility" value="Mme." id="female" />
                                <label for="female" class="col-form-label col-4">Mme.</label>
                            </div>
                        </div>
                </div>

          </div>
            </div>


            <div class="subform_part_check">
                <input type="checkbox" name="cgus" id="cgus" required />
                <label for="cgus">I read and accepts the general conditons</label>
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
          </form>
    </div>
    </div>
</main>
